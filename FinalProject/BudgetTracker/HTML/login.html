<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <link rel="stylesheet" href="../CSS/style.css">
    </head>
    <body>
        <div class="personal-info">
            <h1>Welcome to Budget Tracker Application</h1>
            <p>Enter your name</p> 
            <input type="text" id="userName" >

            <p>Enter your monthly income</p>
            <input type="number" step="any" id="userIncome"><br>

            <p>Enter your monthly budget</p>
            <input type="number" step="any" id="userBudget"><br>

            <p>Enter your fincial gola</p>
            <input type="number" step="any" id="userGoal"><br>

            <p>Enter your current savings</p>
            <input type="number" step="any" id="userSavings"><br>
            
            <button id="submitBtn">START</button>
        </div>
        <script src="../JS/login.js"></script>
    </body>
</html>
